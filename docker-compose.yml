version: '3.8'

# ==============================================================================
# ISW055 - Atividade 6: Armazenamento de Objetos - Upload e Perfil de Usuário
# Professor: Allan Siriani (github.com/siriani)
# Arquitetura: 5 serviços desacoplados em rede interna isolada (app-network)
# - catalogo: Ponto ÚNICO de entrada público (:3000) com Frontend e Backend
# - auth-service: Microsserviço de autenticação e RBAC (:4000 interno)
# - log-service: Microsserviço de observabilidade e auditoria (:5000 interno)
# - redis: Banco NoSQL para Redis Streams de auditoria (:6379 interno)
# - minio: Object Storage S3 compatível para fotos de perfil (:9000 / :9001)
# ==============================================================================

services:
  # 1. Container do Catálogo (Frontend SPA + Backend TMDB/Favoritos/Comentários/Perfil/Storage)
  catalogo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:4000
      - LOG_SERVICE_URL=http://log-service:5000
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-aluno}
      - DB_PASSWORD=${DB_PASSWORD:-alunosenha}
      - DB_NAME=${DB_NAME:-catalogo_filmes}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-chave_jwt_secreta_local_dev}
      # Configurações do MinIO Object Storage (Atividade 6)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=9000
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-catalogo-perfil}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9000}
      - AVATAR_STORAGE_MODE=${AVATAR_STORAGE_MODE:-proxy}
      # Configurações do Stripe Plano Premium (Atividade 7)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      - auth-service
      - log-service
      - minio
    networks:
      - app-network
    restart: unless-stopped

  # 2. Microsserviço de Autenticação (Login, Cadastro, RBAC, Tokens e Troca de Senha)
  # ATENÇÃO: Sem 'ports' publicado pro host - acessível APENAS via rede Docker interna
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    expose:
      - "4000"
    environment:
      - PORT=4000
      - LOG_SERVICE_URL=http://log-service:5000
      - DB_HOST=${DB_HOST:-mariadb}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-aluno}
      - DB_PASSWORD=${DB_PASSWORD:-alunosenha}
      - DB_NAME=${DB_NAME:-catalogo_filmes}
      - JWT_SECRET=${JWT_SECRET:-chave_jwt_secreta_local_dev}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-smtp-relay.brevo.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Catálogo Filmes <noreply@catalogofilmes.com>}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_USE_API=${BREVO_USE_API:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    depends_on:
      - log-service
    networks:
      - app-network
    restart: unless-stopped

  # 3. Microsserviço de Observabilidade e Logs de Auditoria (Atividade 5)
  # ATENÇÃO: Sem 'ports' publicado pro host - acessível APENAS internamente
  log-service:
    build:
      context: ./log-service
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_STREAM_KEY=${REDIS_STREAM_KEY:-audit:events}
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped

  # 4. Redis para Streams de Auditoria (Append-Only File habilitado para persistência)
  # ATENÇÃO: Sem porta no host - acessível APENAS na rede interna do Docker
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped

  # 5. MinIO - Object Storage para Uploads de Foto de Perfil (Atividade 6)
  # ATENÇÃO: Sem 'ports' no host - acessível APENAS internamente (evita conflito de portas em servidores compartilhados)
  # Clientes acessam imagens através da rota proxy do catálogo (/api/profile/avatar/...)
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
  minio-data:
    driver: local

networks:
  app-network:
    driver: bridge
